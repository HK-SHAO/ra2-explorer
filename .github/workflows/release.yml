name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-local-web-app:
    runs-on: windows-latest
    env:
      HF_RELEASE_CONFIGURED: ${{ secrets.HF_SPACE_RELEASE_REPO != '' && secrets.HF_TOKEN_RELEASE != '' }}
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install .[dev,release]
          cd frontend
          npm ci
      - name: Prepare pinned reference data
        run: |
          .venv\Scripts\ra2exp.exe sync-names
          .venv\Scripts\ra2exp.exe sync-audio-text
      - name: Validate source and privacy
        run: |
          .venv\Scripts\python.exe -m pytest
          .venv\Scripts\python.exe -m ruff check src tests packaging\hooks
          .venv\Scripts\python.exe scripts\privacy_scan.py --mode tracked
          .venv\Scripts\python.exe scripts\privacy_scan.py --mode history
      - name: Build local web application
        id: package
        continue-on-error: true
        env:
          HF_ENDPOINT: https://hf-mirror.com
          HF_SPACE_RELEASE_REPO: ${{ secrets.HF_SPACE_RELEASE_REPO }}
        run: scripts\build_windows.cmd > release-build.log 2>&1
      - name: Upload failed build diagnostics
        if: steps.package.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: release-build-diagnostics
          path: release-build.log
          if-no-files-found: error
      - name: Report failed build diagnostics
        if: steps.package.outcome == 'failure'
        run: .venv\Scripts\python.exe scripts\report_ci_failure.py release-build.log
      - name: Smoke test packaged CLI
        run: .outputs\RA2-Explorer-Web\ra2exp.exe --help
      - name: Create archive
        run: tar -a -c -f .outputs\RA2-Explorer-Web-x64.zip -C .outputs RA2-Explorer-Web
      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: .outputs/RA2-Explorer-Web-x64.zip
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: RA2-Explorer-Web-x64
          path: .outputs\RA2-Explorer-Web-x64.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create %GITHUB_REF_NAME% .outputs\RA2-Explorer-Web-x64.zip --verify-tag --generate-notes --title %GITHUB_REF_NAME%
      - name: Read release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view %GITHUB_REF_NAME% --json body --jq .body > .outputs\release-notes.txt
      - name: Prepare Hugging Face Space runtime
        if: startsWith(github.ref, 'refs/tags/') && env.HF_RELEASE_CONFIGURED == 'true'
        env:
          HF_ENDPOINT: https://hf-mirror.com
          HF_SPACE_RELEASE_REPO: ${{ secrets.HF_SPACE_RELEASE_REPO }}
        run: .venv\Scripts\python.exe scripts\prepare_hf_space.py --output .outputs\huggingface-space --overwrite
      - name: Synchronize Hugging Face release
        if: startsWith(github.ref, 'refs/tags/') && env.HF_RELEASE_CONFIGURED == 'true'
        env:
          HF_ENDPOINT: https://hf-mirror.com
          HF_SPACE_RELEASE_REPO: ${{ secrets.HF_SPACE_RELEASE_REPO }}
          HF_TOKEN_RELEASE: ${{ secrets.HF_TOKEN_RELEASE }}
        run: .venv\Scripts\python.exe scripts\publish_hf_release.py .outputs\RA2-Explorer-Web-x64.zip --version %GITHUB_REF_NAME% --notes-file .outputs\release-notes.txt --space-bundle .outputs\huggingface-space
      - name: Report missing Hugging Face automation credentials
        if: startsWith(github.ref, 'refs/tags/') && env.HF_RELEASE_CONFIGURED != 'true'
        run: echo Hugging Face synchronization skipped because repository secrets are not configured.
