name: Privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Scan tracked content
        run: python scripts\privacy_scan.py --mode tracked
      - name: Scan reachable history
        run: python scripts\privacy_scan.py --mode history
