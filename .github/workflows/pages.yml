name: Pages

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "frontend/**"
      - "packaging/pages-data.json"
      - "scripts/fetch_pages_snapshot.py"
      - "scripts/privacy_scan.py"
      - "scripts/verify_pages_snapshot.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download pinned slim data
        run: python scripts\fetch_pages_snapshot.py --output .pages-data\RA2-Explorer-Pages-Data.zip
      - name: Verify archive before extraction
        run: python scripts\verify_pages_snapshot.py .pages-data\RA2-Explorer-Pages-Data.zip --lock packaging\pages-data.json
      - name: Build static application
        run: |
          cd frontend
          npm ci
          npm run build:pages
      - name: Assemble and verify site
        run: |
          mkdir frontend\dist\data
          tar -xf .pages-data\RA2-Explorer-Pages-Data.zip -C frontend\dist\data
          copy /y NUL frontend\dist\.nojekyll >NUL
          python scripts\verify_pages_snapshot.py frontend\dist\data
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
